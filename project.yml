name: mDownloader

options:
  bundleIdPrefix: com.mdownloader
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.1"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    ENABLE_BITCODE: "NO"

targets:
  mDownloader:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
      - path: Sources/Screens
      - path: Sources/Models
      - path: Sources/Services
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: mDownloader
        PRODUCT_BUNDLE_IDENTIFIER: com.mdownloader.app
        INFOPLIST_FILE: Support/App-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: mDownloaderWidget
        embed: true
        codeSign: false
      - target: mDownloaderShare
        embed: true
        codeSign: false

  mDownloaderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Models
      - path: Sources/DesignSystem/Theme.swift
    settings:
      base:
        PRODUCT_NAME: mDownloaderWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.mdownloader.app.widget
        INFOPLIST_FILE: Support/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"

  mDownloaderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
    settings:
      base:
        PRODUCT_NAME: mDownloaderShare
        PRODUCT_BUNDLE_IDENTIFIER: com.mdownloader.app.share
        INFOPLIST_FILE: Support/Share-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"

schemes:
  mDownloader:
    build:
      targets:
        mDownloader: all
    run:
      config: Debug
    archive:
      config: Release
